<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #0A0A0A; font-family: 'Courier New', Courier, monospace; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #0D0D12; }
      ::-webkit-scrollbar-thumb { background: #1A1A28; border-radius: 2px; }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg:         '#0A0A0A',
              surface:    '#0D0D12',
              secondary:  '#12121A',
              border:     '#1A1A28',
              fg:         '#E8E8EC',
              muted:      '#4A4A5A',
              primary:    '#00F0FF',
              accent:     '#39FF14',
              danger:     '#FF2D55',
              warning:    '#FFD60A',
            },
            fontFamily: {
              mono: ['"Courier New"', 'Courier', 'monospace'],
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-bg min-h-screen text-fg font-mono">
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect } = React;

      /* ── helpers ── */
      function useSydneyTime() {
        const [time, setTime] = useState('');
        useEffect(() => {
          function tick() {
            setTime(new Date().toLocaleTimeString('en-AU', {
              timeZone: 'Australia/Sydney',
              hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
            }));
          }
          tick();
          const id = setInterval(tick, 1000);
          return () => clearInterval(id);
        }, []);
        return time;
      }

      /* ── ERG Widget ── */
      function ErgWidget() {
        return (
          <div className="flex items-center justify-between bg-surface border border-border rounded-xl px-4 py-3 mb-4">
            <div className="flex flex-col gap-2">
              <span className="text-muted text-[9px] tracking-[2px] uppercase">ERG THIS WEEK</span>
              <div className="flex items-center gap-3">
                {/* sessions */}
                <div className="flex flex-col items-start gap-0.5">
                  <span className="text-primary text-xl font-bold tracking-tight leading-none">0</span>
                  <span className="text-muted text-[9px]">sessions</span>
                </div>
                {/* divider */}
                <div className="w-px h-7 bg-border rounded" />
                {/* meters */}
                <div className="flex flex-col items-start gap-0.5">
                  <span className="text-fg text-xl font-bold tracking-tight leading-none">0</span>
                  <span className="text-muted text-[9px]">meters</span>
                </div>
                {/* divider */}
                <div className="w-px h-7 bg-border rounded" />
                {/* PB */}
                <div className="flex flex-col items-start gap-0.5">
                  <span className="text-muted text-xl font-bold tracking-tight leading-none">--:--</span>
                  <span className="text-muted text-[9px]">PB 2K</span>
                </div>
              </div>
            </div>
            <div className="text-muted text-[9px] tracking-widest">NO PB</div>
          </div>
        );
      }

      /* ── Section Label ── */
      function SectionLabel({ children, className = '' }) {
        return (
          <p className={`text-muted text-[9px] tracking-[2px] uppercase mb-3 ${className}`}>
            {children}
          </p>
        );
      }

      /* ── Empty State ── */
      function EmptyBox({ primary, secondary }) {
        return (
          <div className="border border-border border-dashed rounded-xl flex flex-col items-center justify-center gap-2 py-10">
            <span className="text-muted text-sm font-medium">{primary}</span>
            <span className="text-muted text-xs opacity-60">{secondary}</span>
          </div>
        );
      }

      /* ── Dashboard ── */
      function Dashboard() {
        const time = useSydneyTime();

        return (
          <div className="max-w-xl mx-auto px-4 pt-12 pb-20">

            {/* Header */}
            <div className="flex items-start justify-between mb-6">
              <div className="flex flex-col gap-0.5">
                <span className="text-muted text-[10px] tracking-[2px] uppercase">COMMAND CENTER</span>
                <span
                  className="text-primary text-3xl font-bold tracking-tight leading-none mt-1"
                  style={{ fontVariantNumeric: 'tabular-nums' }}
                >
                  {time || '──:──:──'}
                </span>
                <span className="text-muted text-[10px] tracking-[1px] mt-0.5">Sydney, Australia</span>
              </div>
              <div className="text-muted text-[10px] tracking-[1.5px] pt-1 opacity-40 select-none">
                STRAVA
              </div>
            </div>

            {/* ERG Widget */}
            <ErgWidget />

            {/* This Week */}
            <SectionLabel className="mt-2">THIS WEEK — BY SPORT</SectionLabel>
            <EmptyBox primary="No activities this week" secondary="Connect Strava to sync" />

            {/* Recent Activities */}
            <SectionLabel className="mt-7">RECENT ACTIVITIES</SectionLabel>
            <EmptyBox primary="No activities found" secondary="Connect Strava to sync" />

          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<Dashboard />);
    </script>
  </body>
</html>
